<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyFlow | Sign in</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth"><main class="auth-card"><div class="brand"><span class="logo">M</span><div><h1>MoneyFlow</h1><p>Take control of your money.</p></div></div><h2>Welcome back</h2><p class="muted">Sign in to manage your finances.</p><form id="form"><label>Email address<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="primary" type="submit">Sign in</button><p id="message" class="message" role="status"></p></form><p class="foot">New to MoneyFlow? <a href="/signup.html">Create an account</a></p></main><script>const form=document.querySelector('#form'),msg=document.querySelector('#message');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Sign in failed');localStorage.setItem('moneyflowUser',JSON.stringify(d.user));location.href='/dashboard.html'}catch(err){msg.textContent=err.message}});</script></body></html>
