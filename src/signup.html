<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | MoneyFlow</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth"><main class="auth-card"><div class="brand"><span class="logo">M</span><div><h1>MoneyFlow</h1><p>Start building better money habits.</p></div></div><h2>Create your account</h2><form id="form"><label>Full name<input id="name" required autocomplete="name"></label><label>Email address<input id="email" type="email" required autocomplete="email"></label><label>Phone (optional)<input id="phone" type="tel" autocomplete="tel"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="new-password"></label><button class="primary">Create account</button><p id="message" class="message" role="status"></p></form><p class="foot">Already registered? <a href="/login.html">Sign in</a></p></main><script>const form=document.querySelector('#form'),msg=document.querySelector('#message');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Creating account…';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,phone:phone.value,password:password.value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Registration failed');localStorage.setItem('moneyflowUser',JSON.stringify(d.user));location.href='/dashboard.html'}catch(err){msg.textContent=err.message}});</script></body></html>
