<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | MoneyFlow</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><a class="brand small" href="/dashboard.html"><span class="logo">M</span><strong>MoneyFlow</strong></a><div class="userbox"><span id="welcome">My finances</span><button id="logout" class="ghost">Sign out</button></div></header><main class="container"><section class="heading"><div><p class="eyebrow">PERSONAL FINANCE</p><h1>Dashboard</h1><p class="muted">A clear picture of where your money goes.</p></div><span class="date" id="today"></span></section><section class="stats"><article class="stat"><span>Total income</span><strong id="incomeTotal">₹0.00</strong></article><article class="stat"><span>Total expenses</span><strong id="expenseTotal">₹0.00</strong></article><article class="stat balance"><span>Available balance</span><strong id="balance">₹0.00</strong></article></section><section class="grid"><article class="panel"><h2>Add income</h2><form id="incomeForm" class="form-grid"><label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Source<input name="source" placeholder="Salary, freelance…" required></label><button class="primary">Save income</button></form></article><article class="panel"><h2>Add expense</h2><form id="expenseForm" class="form-grid"><label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Category<input name="category" placeholder="Food, travel…" required></label><label class="wide">Description<input name="description" placeholder="Optional note"></label><button class="primary">Save expense</button></form></article><article class="panel"><h2>Savings goal</h2><form id="goalForm" class="form-grid"><label class="wide">Goal name<input name="name" placeholder="Emergency fund" required></label><label>Target (₹)<input name="targetAmount" type="number" min="1" step="0.01" required></label><button class="primary">Create goal</button></form><div id="goals" class="records"></div></article><article class="panel"><h2>Recent transactions</h2><div id="transactions" class="records"><p class="muted">Loading…</p></div></article></section><p id="notice" class="message" role="status"></p><footer>MoneyFlow · Track thoughtfully. Spend intentionally.</footer></main><script>const user=JSON.parse(localStorage.getItem('moneyflowUser')||'null');if(!user){location.replace('/login.html')}const $=s=>document.querySelector(s),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});$('#welcome').textContent='Hello, '+(user?.name||'there');$('#today').textContent=new Date().toLocaleDateString('en-IN',{dateStyle:'full'});$('#logout').onclick=()=>{localStorage.removeItem('moneyflowUser');location.href='/login.html'};let data={incomes:[],expenses:[],goals:[]};async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.message||'Request failed');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function refresh(){try{const r=await fetch('/api/user/'+encodeURIComponent(user.id));const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Could not load account');data=d;const inc=d.incomes.reduce((a,x)=>a+Number(x.amount||0),0),exp=d.expenses.reduce((a,x)=>a+Number(x.amount||0),0);$('#incomeTotal').textContent=money(inc);$('#expenseTotal').textContent=money(exp);$('#balance').textContent=money(inc-exp);const rows=[...d.incomes.map(x=>({...x,kind:'Income',label:x.source||'Income',sign:'+'})),...d.expenses.map(x=>({...x,kind:'Expense',label:x.category||'Expense',sign:'−'}))].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,12);$('#transactions').innerHTML=rows.length?rows.map(x=>`<div class="record"><div><strong>${esc(x.label)}</strong><small>${esc(x.kind)} · ${esc((x.date||'').slice(0,10))}</small></div><b>${x.sign}${money(x.amount)}</b></div>`).join(''):'<p class="muted">No transactions yet. Add your first income or expense.</p>';$('#goals').innerHTML=d.goals.length?d.goals.map(g=>{const pct=Math.min(100,100*Number(g.savedAmount||0)/Number(g.targetAmount||1));return `<div class="record goal"><div><strong>${esc(g.name)}</strong><small>${money(g.savedAmount)} of ${money(g.targetAmount)}</small><div class="progress"><i style="width:${pct}%"></i></div></div><b>${Math.round(pct)}%</b></div>`}).join(''):'<p class="muted">No savings goals yet.</p>'}catch(e){$('#notice').textContent=e.message}}function submit(selector,action){const f=$(selector);f.addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(f));body.userId=user.id;try{await api('/api/'+action,body);f.reset();$('#notice').textContent='Saved successfully.';await refresh()}catch(err){$('#notice').textContent=err.message}})}submit('#incomeForm','add-income');submit('#expenseForm','add-expense');submit('#goalForm','add-goal');refresh();</script></body></html>
